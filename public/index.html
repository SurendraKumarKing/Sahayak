<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sahayak Smart Assistant</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script type="module" src="script.js" defer></script>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <img src="Sahayak_image.png" alt="Bot Avatar" />
      <h3>Sahayak</h3>
    </div>
    <div class="chat-messages" id="chat"></div>
    <div class="chat-input">
      <label for="file-upload"><i class="fas fa-paperclip"></i></label>
      <input id="file-upload" class="hidden" type="file" accept="image/*,.pdf,.docx" />
      <button id="voice-button" title="Click to start/stop recording voice message"><i class="fas fa-microphone"></i></button>
      <input type="text" id="user-input" placeholder="Type a message..." />
      <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>
</body>
</html>
